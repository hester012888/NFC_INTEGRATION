version: '3.8'

services:
  server:
    build: ./server
    container_name: my-server
    ports:
      - "9976:9976"
    volumes:
      - ./server:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - PORT=9976
    restart: unless-stopped

  client:
    build: ./client
    container_name: my-client
    ports:
      - "5173:5173"
    volumes:
      - ./client:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - server
    restart: unless-stopped